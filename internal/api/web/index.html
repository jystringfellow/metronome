<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Metronome</title>
  <link rel="stylesheet" href="/board.css">
  <script src="/board.js" defer></script>
</head>
<body>
  <header>
    <h1>Metronome <span>Read-only board</span></h1>
    <p id="status" role="status">Loading…</p>
    <noscript>The board needs JavaScript to read the local API.</noscript>
  </header>
  <main>
    <section><h2>Limits</h2><div id="limits">Loading…</div></section>
    <section><h2>Items</h2><div id="items">Loading…</div></section>
    <section><h2>Slices</h2><div id="slices">Loading…</div></section>
    <section><h2>Open runs</h2><div id="runs">Loading…</div></section>
    <section><h2>Open asks</h2><div id="asks">Loading…</div></section>
    <section><h2>Latest events</h2><div id="events">Loading…</div></section>
  </main>
</body>
</html>
