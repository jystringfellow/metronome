<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Metronome</title>
  <link rel="stylesheet" href="/board.css">
  <script src="/board.js" defer></script>
</head>
<body>
  <header>
    <h1>Metronome <span>Read-only board</span></h1>
    <p id="updated">Loading…</p>
    <p id="status" role="status"></p>
    <noscript>The board needs JavaScript to read the local API.</noscript>
  </header>
  <nav id="workstreams" aria-label="Workstreams"></nav>
  <nav id="labels" aria-label="Labels"></nav>
  <main>
    <div id="attention" aria-label="Needs attention"></div>
    <div id="lanes"></div>
    <div id="reviewers"></div>
    <section><h2>Recent activity</h2><div id="events">Loading…</div></section>
  </main>
</body>
</html>
