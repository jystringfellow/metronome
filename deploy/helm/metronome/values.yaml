image:
  repository: ghcr.io/jystringfellow/metronome
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
actor: metronome
database:
  type: postgres
  postgres:
    existingSecret: ""
    key: url
  sqlite:
    persistence:
      existingClaim: ""
      size: 1Gi
      storageClassName: ""
      accessModes: [ReadWriteOnce]
      annotations: {}
config:
  version: 1
secretEnv: []
envFromSecrets: []
extraEnv: []
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
service:
  type: ClusterIP
  port: 7340
  annotations: {}
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: metronome.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  allowWithoutProxy: false
authProxy:
  enabled: false
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  port: 4180
  args: []
  env: []
  secretEnv: []
  resources: {}
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
probes:
  startup:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 5
    failureThreshold: 30
  liveness:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    httpGet:
      path: /readyz
      port: http
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
serviceAccount:
  create: true
  name: ""
  annotations: {}
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
terminationGracePeriodSeconds: 30
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
extraVolumes: []
extraVolumeMounts: []
